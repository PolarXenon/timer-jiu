<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Faixa preta amarrada: volta da cintura, as duas pontas caindo e o nó por cima.
       Contorno claro porque o fundo do app é escuro. Claude, 17/10/2026. -->
  <g stroke="#e8e4d7" stroke-width="2" stroke-linejoin="round" fill="#111">
    <path d="M2 21 Q32 14 62 17 L62 26 Q32 23 2 30 Z"/>
    <path d="M28.5 28 Q25 44 14.5 57.5 L22.5 61.5 Q32 47 36.5 29.5 Z"/>
    <path d="M37 28.5 Q42.5 42 46.5 59 L55.5 55.5 Q50 39 44.5 26.5 Z"/>
  </g>
  <!-- ponta vermelha com dois graus brancos, perto do fim da ponta direita -->
  <path d="M42.4 44.6 L50.6 41.4 L53.9 49.6 L45.2 52.8 Z" fill="#c83e35"/>
  <path d="M43.3 47.4 L51.7 44.1 M44.3 50.2 L52.8 46.9" stroke="#f3f1e8" stroke-width="1.5"/>
  <!-- nó: quadrado inclinado com a dobra cruzando -->
  <path d="M24.5 12.5 Q33 9.5 41 10.5 L43 29 Q35 31.5 26.5 30.5 Z" fill="#111" stroke="#e8e4d7" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 24 Q33 17 41.8 17.5" stroke="#e8e4d7" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
